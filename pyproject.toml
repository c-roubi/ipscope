[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipscope"
version = "0.9.0"
description = "Fast, multi-source reverse IP lookup tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=42",
    "keyring>=24",
    "dnspython>=2.4",
    "tldextract>=5",
]

[project.optional-dependencies]
gui = ["pywebview>=5"]
dev = ["pytest>=8"]

[project.scripts]
ipscope = "ipscope.cli:app"

[project.gui-scripts]
ipscope-gui = "ipscope.gui.app:main"

[tool.setuptools.packages.find]
include = ["ipscope*"]

[tool.setuptools.package-data]
"ipscope.gui" = ["web/*"]
